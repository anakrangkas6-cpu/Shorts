name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Generate and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android media permissions
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          required = {
              "android.permission.READ_MEDIA_VIDEO": None,
              "android.permission.READ_EXTERNAL_STORAGE": "32",
          }
          existing = {node.get(android + "name") for node in root.findall("uses-permission")}
          for permission, max_sdk in required.items():
              if permission not in existing:
                  node = ET.Element("uses-permission", {android + "name": permission})
                  if max_sdk:
                      node.set(android + "maxSdkVersion", max_sdk)
                  root.insert(0, node)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PYTHON

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kilas-Shorts-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
